<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- left title block -->
  <g transform="translate(80,120)">
    <text x="0" y="0" fill="#ffffff" font-family="IBM Plex Sans, Arial, sans-serif" font-size="48" font-weight="600">Ahmad Hasan Sakib</text>
    <text x="0" y="72" fill="#9ca3af" font-family="IBM Plex Sans, Arial, sans-serif" font-size="36">Metaoptics & Metalenses</text>
  </g>
  <!-- minimalist pillar motif on right -->
  <g transform="translate(720,150)">
    <!-- pillars columns -->
    <rect x="0" y="40" width="40" height="280" rx="8" fill="#e6eef8"/>
    <rect x="70" y="20" width="40" height="300" rx="8" fill="#dbe8ff"/>
    <rect x="140" y="0" width="40" height="320" rx="8" fill="#cfe0ff"/>
    <rect x="210" y="20" width="40" height="300" rx="8" fill="#dbe8ff"/>
    <rect x="280" y="40" width="40" height="280" rx="8" fill="#e6eef8"/>
    <!-- wave overlay -->
    <path d="M-40 360 C 120 260, 200 260, 320 360 C 440 460, 560 460, 680 360" fill="none" stroke="#9fb7ff" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
  </g>
</svg>
