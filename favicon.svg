<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Minimal metalens / metasurface motif: row of nanopillars and a gentle wave -->
  <rect width="64" height="64" rx="8" fill="#ffffff"/>
  <g fill="#0f172a" stroke="none">
    <!-- pillars: 7 rounded pillars centered -->
    <rect x="8" y="22" width="6" height="20" rx="2"/>
    <rect x="16" y="18" width="6" height="24" rx="2"/>
    <rect x="24" y="14" width="6" height="28" rx="2"/>
    <rect x="32" y="12" width="6" height="30" rx="2"/>
    <rect x="40" y="14" width="6" height="28" rx="2"/>
    <rect x="48" y="18" width="6" height="24" rx="2"/>
    <rect x="56" y="22" width="0" height="0" rx="0"/>
  </g>
  <!-- smooth wavefront line hint -->
  <path d="M6 44 C 20 36, 28 36, 38 44 C 48 52, 58 52, 58 44" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
</svg>
